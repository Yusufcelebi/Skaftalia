<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111210"><title>Skaftalia Writer</title><link rel="stylesheet" href="writer.css"></head><body>
<div class="shell"><header><a class="brand" href="../index.html"><span class="mark">S.</span> SKAFTALIA <small>WRITER</small></a><span id="authState" class="state">Bağlantı kuruluyor…</span></header>
<section id="loginPanel" class="login panel hidden"><p class="eyebrow">YAZAR GİRİŞİ</p><h1>Yazmaya devam et.</h1><p class="muted">Yalnızca yazar hesabınla giriş yapabilirsin.</p><form id="loginForm"><label>E-posta<input id="email" type="email" autocomplete="username" required></label><label>Şifre<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Giriş yap</button><p id="loginError" class="error"></p></form></section>
<section id="appPanel" class="hidden"><div class="layout"><aside class="sidebar panel"><div class="sidehead"><h2>Yazılarım</h2><button id="newPost" class="new">+ Yeni</button></div><div id="postList" class="postlist"></div><button id="logout" class="quiet full">Oturumu kapat</button></aside>
<main class="editor panel"><div class="toolbar"><span id="saveState">Hazır</span><div><button id="saveDraft" class="quiet">Taslak kaydet</button><button id="publish" class="primary">Yayınla</button></div></div>
<div class="fields"><label>Roman adı<input id="novelTitle" value="Skaftalia"></label><label>Roman ID<input id="novelId" value="skaftalia"></label><label>Roman alt başlığı<input id="novelSubtitle" placeholder="Romanın kısa alt başlığı"></label><label>Tür<input id="genre" value="Roman"></label><label class="wide">Roman açıklaması<input id="novelDescription" placeholder="Kitaplıkta görünecek kısa tanıtım"></label><label>Bölüm numarası<input id="chapterNumber" type="number" min="1" value="1"></label><label>Bölüm tarihi<input id="chapterDate" type="date"></label><label class="wide">Bölüm başlığı<input id="chapterTitle" placeholder="Bölüm başlığı"></label><label class="wide">Kısa alıntı / özet<input id="excerpt" placeholder="Kitaplıkta bölüm hakkında görünecek kısa metin"></label></div>
<textarea id="body" class="writing" placeholder="Buraya yazmaya başla…\n\nParagraflar arasında boş satır bırak."></textarea><div class="bottom"><span>Otomatik kaydetme açık · değişiklikler bulut veritabanına kaydedilir</span><button id="deletePost" class="danger">Bu yazıyı sil</button></div></main></div></section>
<footer>Satır Arası · Yazı masası</footer></div>
<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="writer.js"></script></body></html>
